<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roxy Hub - Black & White Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            /* Arka plana attığın anime kızını ekliyoruz */
            background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://raw.githubusercontent.com/benroxy/RoxyHub.github.io/main/anime-kizi.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
        }

        /* Başlık Siyah'tan Beyaz'a dönen efektli */
        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: transparent;
        }

        .title {
            font-family: 'Oswald', sans-serif;
            font-size: 6em;
            text-transform: uppercase;
            letter-spacing: 15px;
            margin: 0;
            /* Siyah-Beyaz geçiş animasyonu */
            background: linear-gradient(90deg, #000, #fff, #000);
            background-size: 200% auto;
            color: #fff;
            background-clip: text;
            text-fill-color: transparent;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .view-btn {
            margin-top: 30px;
            padding: 15px 40px;
            background-color: transparent;
            color: white;
            border: 2px solid white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            transition: 0.4s;
            border-radius: 5px;
        }

        .view-btn:hover {
            background-color: white;
            color: black;
        }

        .container {
            max-width: 900px;
            margin: 100px auto;
            padding: 50px;
            background: rgba(0, 0, 0, 0.85); /* İçerik okunması için hafif karartma */
            border: 1px solid #333;
            border-radius: 10px;
            text-align: center;
        }

        .code-section-title {
            font-size: 2em;
            margin-bottom: 20px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .code-block {
            background-color: #0a0a0a;
            border: 1px solid #444;
            padding: 25px;
            border-radius: 8px;
            text-align: left;
            position: relative;
        }

        .code-block button {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #fff;
            color: #000;
            border: none;
            padding: 8px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        pre {
            color: #ccc;
            font-family: 'Consolas', monospace;
            overflow-x: auto;
        }

        footer {
            padding: 50px;
            text-align: center;
            color: #555;
            font-size: 0.8em;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="title">Roxy Hub</h1>
        <button class="view-btn" onclick="document.getElementById('scripts').scrollIntoView()">Ürünleri Görüntüle</button>
    </header>

    <div class="container" id="scripts">
        <h2 class="code-section-title">Get Script</h2>
        <p>Aşağıdaki scripti kopyalayarak kullanmaya başlayabilirsin.</p>
        
        <div class="code-block">
            <button onclick="copyCode(this)">Kopyala</button>
            <pre id="myCode">
loadstring(game:HttpGet("https://raw.githubusercontent.com/benroxy/RoxyHub/main/script.lua"))()
            </pre>
        </div>
    </div>

    <footer>
        &copy; 2026 ROXY HUB / BLACK & WHITE EDITION
    </footer>

    <script>
        function copyCode(buttonElement) {
            const codeBlock = buttonElement.parentNode.querySelector('pre');
            const range = document.createRange();
            range.selectNode(codeBlock);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            try {
                document.execCommand('copy');
                buttonElement.textContent = 'Kopyalandı';
                setTimeout(() => {
                    buttonElement.textContent = 'Kopyala';
                }, 2000);
            } catch (err) {
                alert('Hata!');
            }
            window.getSelection().removeAllRanges();
        }
    </script>

</body>
</html>
