<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROXY HUB | Premium</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- CANLI VİDEO ARKA PLAN --- */
        .video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            filter: grayscale(100%) brightness(20%);
            object-fit: cover;
        }

        /* Video üzerine ek karartma (yazı okunabilirliği için) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }

        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 5rem;
        }

        /* --- HARF HARF GELEN BAŞLIK --- */
        header {
            margin-top: 8rem;
            margin-bottom: 4rem;
            text-align: center;
        }

        .letter {
            display: inline-block;
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 900;
            letter-spacing: 12px;
            text-transform: uppercase;
            opacity: 0;
            transform: translateY(30px);
            animation: reveal 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            text-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- ŞEFFAF (GLASS) KUTULAR --- */
        .glass-box {
            width: 90%;
            max-width: 850px;
            background: rgba(255, 255, 255, 0.03); /* Çok düşük opaklık */
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px); /* Arka planı bulanıklaştırır */
            -webkit-backdrop-filter: blur(12px);
            padding: 3rem;
            margin-bottom: 4rem;
            text-align: center;
            transition: 0.3s;
        }

        .glass-box:hover {
            border-color: rgba(255,255,255,0.2);
            background: rgba(255, 255, 255, 0.05);
        }

        .glass-box h2 {
            font-size: 0.7rem;
            letter-spacing: 5px;
            color: rgba(255,255,255,0.3);
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        .code-display {
            background: rgba(0, 0, 0, 0.4);
            padding: 1.5rem;
            border: 1px solid rgba(255,255,255,0.05);
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5); /* Şeffaf yazı */
            word-break: break-all;
            margin-bottom: 2rem;
            text-align: left;
        }

        /* --- ŞEFFAF OYUN KARTLARI --- */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1100px;
            width: 90%;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.02); /* Çok şeffaf */
            border: 1px solid rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 2.5rem;
            text-align: center;
            transition: 0.4s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.3);
            background: rgba(255, 255, 255, 0.06);
        }

        .game-card h3 {
            font-size: 1.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            font-weight: 700;
        }

        /* --- BUTONLAR --- */
        .btn-main {
            width: 100%;
            padding: 1.2rem;
            background: #fff;
            color: #000;
            border: none;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-main:hover {
            background: rgba(255,255,255,0.8);
            letter-spacing: 4px;
        }

        .btn-small {
            background: transparent;
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.8rem;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            letter-spacing: 1px;
        }

        .btn-small:hover {
            border-color: #fff;
            color: #fff;
            background: rgba(255,255,255,0.05);
        }

        /* --- TOAST & FOOTER --- */
        #toast {
            visibility: hidden;
            background: #fff;
            color: #000;
            padding: 15px 40px;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 900;
            z-index: 9999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #toast.show { visibility: visible; animation: f-in 0.5s, f-out 0.5s 2.5s; }
        @keyframes f-in { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes f-out { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        footer { margin-top: 6rem; padding: 4rem; color: #333; font-size: 0.7rem; letter-spacing: 8px; font-weight: 900; }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="video-background">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="main-content">
        <header id="typewriter"></header>

        <div class="glass-box">
            <h2>MAIN SCRIPT LOADER</h2>
            <div class="code-display" id="mainLoader">
                loadstring(game:HttpGet("https://raw.githubusercontent.com/benroxy/Roxy-Hub-Reamke/refs/heads/main/Roxy%20Hub%20loader"))()
            </div>
            <button class="btn-main" onclick="copyText('mainLoader')">Copy Loadstring</button>
        </div>

        <div class="container">
            <div class="game-card">
                <h3>Lucky Block</h3>
                <button class="btn-small" onclick="copyText('mainLoader')">Get Script</button>
            </div>

            <div class="game-card">
                <h3>MM2</h3>
                <button class="btn-small" onclick="copyText('mainLoader')">Get Script</button>
            </div>

            <div class="game-card">
                <h3>TSB</h3>
                <button class="btn-small" onclick="copyText('mainLoader')">Get Script</button>
            </div>

            <div class="game-card">
                <h3>Blade Ball</h3>
                <button class="btn-small" onclick="copyText('mainLoader')">Get Script</button>
            </div>
        </div>

        <div id="toast">COPIED SUCCESSFULLY!</div>
        <footer>ROXY HUB V6.3</footer>
    </div>

    <script>
        // Roxy Hub Başlık Animasyonu
        const titleText = "ROXY HUB";
        const headerContainer = document.getElementById('typewriter');
        
        titleText.split('').forEach((char, index) => {
            const span = document.createElement('span');
            span.textContent = char === " " ? "\u00A0" : char;
            span.className = 'letter';
            span.style.animationDelay = `${index * 0.12}s`; // Her harf sırayla gelir
            headerContainer.appendChild(span);
        });

        // Kopyalama Sistemi
        function copyText(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });
        }
    </script>
</body>
</html>
