<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROXY HUB | Trip Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=VT323&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* Ana yazı tipi VT323 (Kafası güzel retro/glitch) */
            font-family: 'VT323', monospace;
            cursor: crosshair; /* Fare imlecini artı işareti yap */
        }

        body {
            background-color: #000;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- CANLI ARKA PLAN (VİDEO) --- */
        .video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            /* Videoyu karartma (yazılar okunsun diye) */
            filter: brightness(25%) contrast(110%);
            object-fit: cover;
        }

        /* Ek hipnotik katman (hafif mor/mavi ton) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4) 0%, rgba(20,0,50,0.2) 100%);
            z-index: 0;
        }

        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 5rem;
        }

        /* --- HARF HARF GELEN HİPNOTİK BAŞLIK --- */
        header {
            margin-top: 10rem;
            margin-bottom: 5rem;
            text-align: center;
        }

        .letter {
            display: inline-block;
            /* Başlık yazı tipi Syncopate (Uçuk/Geniş) */
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(3rem, 12vw, 8rem);
            font-weight: 700;
            letter-spacing: 20px;
            text-transform: uppercase;
            color: #fff;
            opacity: 0;
            transform: translateY(50px) scale(0.8);
            /* Reveal ve Neon Parlama Animasyonu */
            animation: reveal 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards,
                       neon-glow 2s ease-in-out infinite;
            /* Harf Harf Gecikme Ayarı (0.12s'den 0.15s'ye çıkarıldı) */
            animation-delay: calc(var(--i) * 0.15s);
            /* Başlangıçta neon parlaması olmasın */
            animation-play-state: running, paused;
        }

        /* Harfler geldikten sonra neon parlamasını başlat */
        .letter:nth-child(n) {
            animation-play-state: running, running;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Uçuk Neon Parlama Efekti */
        @keyframes neon-glow {
            0%, 100% {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #fff,
                             0 0 40px #ff00de, 0 0 70px #ff00de, 0 0 80px #ff00de;
            }
            50% {
                text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #fff,
                             0 0 20px #ff00de, 0 0 35px #ff00de, 0 0 40px #ff00de;
                transform: skewX(-5deg); /* Harfleri hafifçe yamult (Kafa güzel efekti) */
            }
        }

        /* --- FULL ŞEFFAF KUTU (YÜZEN İÇERİK) --- */
        .transparent-box {
            width: 90%;
            max-width: 900px;
            /* Hiçbir Arka Plan Rengi Yok - Full Şeffaf */
            background: transparent;
            /* Sadece çok ince bir çizgi ve gölge */
            border: 1px dashed rgba(255, 255, 255, 0.1);
            padding: 4rem;
            margin-bottom: 5rem;
            text-align: center;
            transition: 0.3s;
        }

        .transparent-box:hover {
            border-color: rgba(255,0,222,0.3); /* Neon Pembe Çizgiye Dönüş */
            box-shadow: 0 0 20px rgba(255,0,222,0.1);
        }

        .transparent-box h2 {
            font-size: 0.8rem;
            letter-spacing: 6px;
            color: rgba(255,0,222,0.5); /* Neon Pembe Yazı */
            margin-bottom: 2rem;
            text-transform: uppercase;
        }

        /* Kod Kutusu da Full Şeffaf */
        .code-display {
            background: transparent;
            padding: 1rem;
            border-bottom: 2px solid rgba(255,255,255,0.05); /* Sadece Alt Çizgi */
            font-family: 'VT323', monospace;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.4); /* Şeffaf yazı */
            word-break: break-all;
            margin-bottom: 3rem;
            text-align: left;
            opacity: 0.8;
        }

        /* --- FULL ŞEFFAF OYUN KARTLARI --- */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            max-width: 1200px;
            width: 90%;
        }

        .game-card {
            /* Hiçbir Arka Plan Rengi Yok - Full Şeffaf */
            background: transparent;
            /* Sadece çok ince bir çizgi */
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 3rem;
            text-align: center;
            transition: 0.5s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .game-card:hover {
            transform: translateY(-10px) rotateZ(2deg); /* Hem Yüksel hem de Eğil (Kafası güzel efekti) */
            border-color: rgba(0,255,255,0.4); /* Neon Mavi Çizgiye Dönüş */
            box-shadow: 0 0 30px rgba(0,255,255,0.1);
        }

        .game-card h3 {
            font-size: 1.4rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            font-weight: 700;
            color: rgba(0,255,255,0.6); /* Neon Mavi Yazı */
        }

        /* --- BUTONLAR --- */
        .btn-main {
            width: 100%;
            padding: 1.2rem;
            background: transparent;
            color: #fff;
            border: 2px solid #fff; /* Neon Pembe Buton Çizgisi */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.8rem;
            position: relative;
            overflow: hidden;
        }

        .btn-main:hover {
            background: #fff;
            color: #000;
            letter-spacing: 5px;
            box-shadow: 0 0 30px #fff;
        }

        .btn-secondary {
            background: transparent;
            color: rgba(0,255,255,0.5); /* Neon Mavi Buton Yazısı */
            border: 1px solid rgba(0,255,255,0.2); /* Neon Mavi Buton Çizgisi */
            padding: 0.8rem;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
            letter-spacing: 2px;
        }

        .btn-secondary:hover {
            border-color: rgba(0,255,255,0.8);
            color: rgba(0,255,255,0.8);
            background: rgba(0,255,255,0.05);
            box-shadow: 0 0 15px rgba(0,255,255,0.1);
        }

        /* --- TOAST & FOOTER --- */
        #toast {
            visibility: hidden;
            background: #ff00de; /* Neon Pembe Bildirim */
            color: #fff;
            padding: 15px 50px;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 900;
            z-index: 9999;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Syncopate', sans-serif;
            font-size: 0.8rem;
            box-shadow: 0 0 30px #ff00de;
        }
        #toast.show { visibility: visible; animation: f-in 0.5s, f-out 0.5s 2.5s; }
        @keyframes f-in { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes f-out { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        footer { margin-top: 8rem; padding: 4rem; color: #111; font-size: 0.8rem; letter-spacing: 15px; font-weight: 900; }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="video-background">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="main-content">
        <header id="typewriter"></header>

        <div class="transparent-box">
            <h2>MAIN SCRIPT LOADER</h2>
            <div class="code-display" id="mainLoader">
                loadstring(game:HttpGet("https://raw.githubusercontent.com/benroxy/Roxy-Hub-Reamke/refs/heads/main/Roxy%20Hub%20loader"))()
            </div>
            <button class="btn-main" onclick="copyText('mainLoader')">Copy Loadstring</button>
        </div>

        <div class="container">
            <div class="game-card">
                <h3>Lucky Block</h3>
                <button class="btn-secondary" onclick="copyText('mainLoader')">Get Script</button>
            </div>

            <div class="game-card">
                <h3>MM2</h3>
                <button class="btn-secondary" onclick="copyText('mainLoader')">Get Script</button>
            </div>

            <div class="game-card">
                <h3>TSB</h3>
                <button class="btn-secondary" onclick="copyText('mainLoader')">Get Script</button>
            </div>

            <div class="game-card">
                <h3>Blade Ball</h3>
                <button class="btn-secondary" onclick="copyText('mainLoader')">Get Script</button>
            </div>
        </div>

        <div id="toast">COPIED SUCCESSFULLY!</div>
        <footer>ROXY HUB V6.3</footer>
    </div>

    <script>
        // Roxy Hub Başlık Animasyonu (Hipnotik)
        const titleText = "ROXY HUB";
        const headerContainer = document.getElementById('typewriter');
        
        titleText.split('').forEach((char, index) => {
            const span = document.createElement('span');
            span.textContent = char === " " ? "\u00A0" : char;
            span.className = 'letter';
            span.style.setProperty('--i', index); // Harf sırasını CSS'e aktar
            headerContainer.appendChild(span);
        });

        // Kopyalama Sistemi
        function copyText(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });
        }
    </script>
</body>
</html>
