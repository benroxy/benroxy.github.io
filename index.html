<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roxy Hub - Roi Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Russo+One&family=Inter:wght@400;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        /* İMLEÇLER */
        html, body, * { cursor: url('https://cur.cursors-4u.net/others/oth-10/oth938.cur'), default !important; }
        button, a, .ai-opt, #ai-btn, .copy-btn, [onclick], input[type="range"] { cursor: url('https://cur.cursors-4u.net/others/oth-10/oth937.cur'), pointer !important; }

        body {
            margin: 0; padding: 0; background-color: #000;
            background-image: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('https://raw.githubusercontent.com/benroxy/benroxy.github.io/main/anime-kizi.jpg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            color: #ffffff; font-family: 'Inter', sans-serif; scroll-behavior: smooth; overflow-x: hidden;
        }

        /* GİRİŞ ANİMASYONU */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; perspective: 1000px; }
        
        .title {
            font-family: 'Syncopate', sans-serif; font-size: 6.5em; text-transform: uppercase; letter-spacing: 25px; margin: 0;
            background: linear-gradient(90deg, #000, #fff, #000); background-size: 200% auto;
            color: #fff; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite, fadeInUp 1s ease-out;
            transition: transform 0.1s ease-out;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .view-btn {
            margin-top: 50px; padding: 20px 60px; background: rgba(255,255,255,0.02); color: white; border: 1px solid rgba(255,255,255,0.1);
            font-weight: bold; text-transform: uppercase; letter-spacing: 4px; transition: 0.4s; backdrop-filter: blur(15px);
            border-radius: 8px; animation: fadeInUp 1.2s ease-out;
        }
        .view-btn:hover { background: white; color: black; box-shadow: 0 0 30px rgba(255,255,255,0.3); transform: translateY(-5px); }

        /* SES KONTROL PANELİ (Sol Alt) */
        #music-panel {
            position: fixed; bottom: 35px; left: 35px; background: rgba(0,0,0,0.9);
            padding: 12px 20px; border-radius: 50px; display: flex; align-items: center; gap: 15px;
            border: 1px solid #222; backdrop-filter: blur(10px); z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #mute-btn { background: none; border: none; color: white; font-size: 18px; line-height: 1; padding: 0; }
        #volume-slider { width: 70px; accent-color: #fff; background: #333; height: 4px; border-radius: 2px; appearance: none; }

        .container {
            max-width: 900px; margin: 0 auto 100px auto; padding: 60px;
            background: rgba(2, 2, 2, 0.98); border: 1px solid #111; text-align: center; border-radius: 25px;
            box-shadow: 0 0 50px rgba(0,0,0,1); animation: fadeInUp 1.5s ease-out;
        }

        /* NEON STATUS */
        .status-container { display: flex; justify-content: center; gap: 20px; margin-bottom: 50px; }
        .status-item { background: #050505; padding: 15px 30px; border: 1px solid #151515; border-radius: 12px; display: flex; align-items: center; gap: 12px; font-size: 0.8em; }
        .dot { height: 12px; width: 12px; border-radius: 50%; }
        .working { background-color: #00ff00; box-shadow: 0 0 15px #00ff00; }
        .down { background-color: #ff0000; box-shadow: 0 0 15px #ff0000; }

        .script-box { background: #020202; border: 1px solid #1a1a1a; border-radius: 18px; text-align: left; overflow: hidden; margin-top: 25px; }
        .script-header { background: #080808; padding: 18px 25px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #151515; }
        .copy-btn { background: #fff; color: #000; border: none; padding: 10px 25px; border-radius: 6px; font-weight: 900; }

        .script-content { padding: 35px; }
        pre { margin: 0; color: #666; font-family: 'Fira Code', monospace; font-size: 1.05em; line-height: 1.7; white-space: pre-wrap; word-break: break-all; }

        /* AI BOT */
        #ai-btn {
            position: fixed; bottom: 35px; right: 35px; width: 80px; height: 80px; border-radius: 50%;
            background-image: url('https://raw.githubusercontent.com/benroxy/benroxy.github.io/main/ai-icon.jpg');
            background-size: cover; border: 2px solid #fff; z-index: 1000; transition: 0.4s;
        }
        #ai-window {
            position: fixed; bottom: 130px; right: 35px; width: 350px; background: #050505;
            border: 1px solid #1a1a1a; border-radius: 24px; display: none; flex-direction: column; z-index: 1000; overflow: hidden;
            box-shadow: 0 25px 60px rgba(0,0,0,1);
        }
        .ai-header { background: #fff; color: #000; padding: 20px; font-weight: 900; text-align: center; }
        .ai-content { padding: 30px; height: 220px; overflow-y: auto; color: #777; }
        .ai-options { padding: 20px; display: flex; flex-direction: column; gap: 10px; background: #020202; }
        .ai-opt { background: #080808; border: 1px solid #151515; color: #eee; padding: 14px; border-radius: 10px; text-align: left; transition: 0.3s; }
        .ai-opt:hover { background: #fff; color: #000; }

        footer { padding: 80px; text-align: center; color: #111; letter-spacing: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="Roi (Retake) - Official Lyric Video.mp3" type="audio/mpeg">
    </audio>

    <div id="music-panel">
        <button id="mute-btn" onclick="toggleMute()">🔊</button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" oninput="changeVolume(this.value)">
    </div>

    <div class="hero">
        <h1 class="title" id="mainTitle">Roxy Hub</h1>
        <button class="view-btn" onclick="startExperience()">Sistemi Keşfet</button>
    </div>

    <div class="container" id="products">
        <div class="status-container">
            <div class="status-item"><span class="dot working"></span><span>ROXY HUB: <span style="color:#00ff00; font-weight:bold;">ONLINE</span></span></div>
            <div class="status-item"><span class="dot down"></span><span>ROXYSPLOIT: <span style="color:#ff0000; font-weight:bold;">OFFLINE</span></span></div>
        </div>

        <h2 style="font-family:'Russo One'; letter-spacing: 5px;">MAIN SOURCE</h2>
        <div class="script-box">
            <div class="script-header">
                <span style="color:#444; font-size: 11px; letter-spacing: 2px;">ENCRYPTED LUA ACCESS</span>
                <button class="copy-btn" onclick="copyCode(this)">KOPYALA</button>
            </div>
            <div class="script-content">
                <pre id="myCode">loadstring(game:HttpGet("https://raw.githubusercontent.com/benroxy/RoxyHub/main/script.lua"))()</pre>
            </div>
        </div>
    </div>

    <div id="ai-btn" onclick="toggleAI()"></div>
    <div id="ai-window">
        <div class="ai-header">Roxy Power</div>
        <div class="ai-content" id="ai-text">Roi (Retake) çalıyor, keyifler yerinde mi kanka?</div>
        <div class="ai-options">
            <button class="ai-opt" onclick="askPower('Roxy Hub Güvenli mi?')">Güvenli mi?</button>
            <button class="ai-opt" onclick="askPower('Key İstiyor mu?')">Key var mı?</button>
        </div>
    </div>

    <footer>ROXY HUB &copy; 2026</footer>

    <script>
        const music = document.getElementById('bgMusic');
        const muteBtn = document.getElementById('mute-btn');

        // Müzik Başlatma ve Sayfaya Kaydırma
        function startExperience() {
            music.play().catch(e => console.log("Müzik başlatılamadı, etkileşim bekleniyor."));
            document.getElementById('products').scrollIntoView();
        }

        function toggleMute() {
            if (music.muted) {
                music.muted = false;
                muteBtn.innerText = "🔊";
            } else {
                music.muted = true;
                muteBtn.innerText = "🔇";
            }
        }

        function changeVolume(val) {
            music.volume = val;
        }

        // PARALAKS
        document.addEventListener('mousemove', (e) => {
            const title = document.getElementById('mainTitle');
            const x = (window.innerWidth / 2 - e.pageX) / 30;
            const y = (window.innerHeight / 2 - e.pageY) / 30;
            title.style.transform = `translateX(${x}px) translateY(${y}px)`;
        });

        function toggleAI() {
            var win = document.getElementById('ai-window');
            win.style.display = (win.style.display === 'flex') ? 'none' : 'flex';
        }

        function askPower(q) {
            var text = document.getElementById('ai-text');
            var a = q === 'Roxy Hub Güvenli mi?' ? "Valla %100 güvenli kanka, tertemiz!" : "Keyless devam, bizde cüzdan değil icraat konuşur.";
            text.innerHTML = "<b>Sen:</b> "+q+"<br><br><b>Power:</b> "+a;
        }

        function copyCode(btn) {
            const pre = document.getElementById('myCode');
            const range = document.createRange();
            range.selectNode(pre);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            btn.textContent = 'OK!';
            setTimeout(() => { btn.textContent = 'KOPYALA'; }, 2000);
            window.getSelection().removeAllRanges();
        }
    </script>
</body>
</html>
