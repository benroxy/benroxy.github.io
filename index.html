<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROXY HUB | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #050505; /* Derin siyah, gözü dinlendirir */
            color: #e0e0e0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* --- ARKA PLAN VİDEOSU --- */
        .video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -1;
            filter: grayscale(100%) brightness(15%); /* Videoyu iyice kararttık */
            object-fit: cover;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Hafif pembe geçişli ama karanlık maske */
            background: radial-gradient(circle at center, rgba(255, 20, 147, 0.05) 0%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 0;
        }

        .main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 5rem;
        }

        /* --- SOFT PEMBE BAŞLIK --- */
        header {
            margin-top: 8rem;
            margin-bottom: 4rem;
            text-align: center;
        }

        .letter {
            display: inline-block;
            font-family: 'Syncopate', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 700;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: #ff69b4; /* Soft pembe */
            opacity: 0;
            transform: translateY(20px);
            animation: reveal 0.8s forwards;
            animation-delay: calc(var(--i) * 0.1s);
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.3);
        }

        @keyframes reveal {
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- DARK GLASS KUTULAR --- */
        .glass-box {
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 105, 180, 0.1); /* Çok ince pembe çerçeve */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 2.5rem;
            margin-bottom: 3rem;
            border-radius: 8px;
            text-align: center;
        }

        .glass-box h2 {
            font-size: 0.7rem;
            letter-spacing: 4px;
            color: rgba(255, 105, 180, 0.5);
            margin-bottom: 1.5rem;
            text-transform: uppercase;
        }

        .code-display {
            background: rgba(0, 0, 0, 0.5);
            padding: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.03);
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #888;
            word-break: break-all;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        /* --- OYUN KARTLARI --- */
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 95%;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            padding: 2rem;
            border-radius: 6px;
            text-align: center;
            transition: 0.3s;
        }

        .game-card:hover {
            background: rgba(255, 105, 180, 0.03);
            border-color: rgba(255, 105, 180, 0.3);
            transform: translateY(-5px);
        }

        .card-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .game-card h3 {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            color: #ccc;
        }

        /* --- GREEN WORKING AMBLEM --- */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.6rem;
            font-weight: 900;
            color: #00ff88; /* Daha soft bir yeşil */
            letter-spacing: 1px;
            padding: 2px 6px;
            border: 1px solid rgba(0, 255, 136, 0.2);
            border-radius: 3px;
        }

        .status-badge::before {
            content: "";
            width: 5px;
            height: 5px;
            background-color: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
        }

        /* --- BUTONLAR --- */
        .btn-main {
            width: 100%;
            padding: 1rem;
            background: #ff69b4;
            color: #000;
            border: none;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.75rem;
        }

        .btn-main:hover {
            background: #ff1493;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.4);
        }

        .btn-small {
            background: transparent;
            color: #ff69b4;
            border: 1px solid rgba(255, 105, 180, 0.2);
            padding: 0.7rem;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        .btn-small:hover {
            border-color: #ff69b4;
            background: rgba(255, 105, 180, 0.05);
        }

        /* --- TOAST & FOOTER --- */
        #toast {
            visibility: hidden;
            background: #ff69b4;
            color: #000;
            padding: 12px 30px;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            font-weight: 900;
            font-size: 0.7rem;
            z-index: 9999;
        }
        #toast.show { visibility: visible; animation: f-in 0.5s, f-out 0.5s 2.5s; }
        @keyframes f-in { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes f-out { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        footer { margin-top: 5rem; padding: 3rem; color: #222; font-size: 0.6rem; letter-spacing: 8px; font-weight: 900; }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline class="video-background">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="main-content">
        <header id="typewriter"></header>

        <div class="glass-box">
            <h2>SCRIPT LOADER</h2>
            <div class="code-display" id="mainLoader">
                loadstring(game:HttpGet("https://raw.githubusercontent.com/benroxy/Roxy-Hub-Reamke/refs/heads/main/Roxy%20Hub%20loader"))()
            </div>
            <button class="btn-main" onclick="copyText('mainLoader')">Copy Loadstring</button>
        </div>

        <div class="container">
            <div class="game-card">
                <div class="card-header">
                    <h3>Lucky Block</h3>
                    <div class="status-badge">WORKING</div>
                </div>
                <button class="btn-small" onclick="copyText('mainLoader')">Get Script</button>
            </div>

            <div class="game-card">
                <div class="card-header">
                    <h3>MM2</h3>
                    <div class="status-badge">WORKING</div>
                </div>
                <button class="btn-small" onclick="copyText('mainLoader')">Get Script</button>
            </div>

            <div class="game-card">
                <h3>TSB</h3>
                <div class="card-header" style="margin-bottom:1.5rem">
                    <h3 style="margin-bottom:0">TSB</h3>
                    <div class="status-badge">WORKING</div>
                </div>
                <button class="btn-small" onclick="copyText('mainLoader')">Get Script</button>
            </div>
        </div>

        <div id="toast">COPIED!</div>
        <footer>ROXY HUB V6.3</footer>
    </div>

    <script>
        const titleText = "ROXY HUB";
        const headerContainer = document.getElementById('typewriter');
        
        titleText.split('').forEach((char, index) => {
            const span = document.createElement('span');
            span.textContent = char === " " ? "\u00A0" : char;
            span.className = 'letter';
            span.style.setProperty('--i', index);
            headerContainer.appendChild(span);
        });

        function copyText(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });
        }
    </script>
</body>
</html>
