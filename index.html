<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roxy Hub - Premium Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            /* Anime kızı arka planı */
            background-image: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://raw.githubusercontent.com/benroxy/benroxy.github.io/main/anime-kizi.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* İSTEDİĞİN SİYAH-BEYAZ GEÇİŞLİ BAŞLIK */
        .title {
            font-family: 'Oswald', sans-serif;
            font-size: 7em;
            text-transform: uppercase;
            letter-spacing: 20px;
            margin: 0;
            background: linear-gradient(90deg, #000, #fff, #000);
            background-size: 200% auto;
            color: #fff;
            background-clip: text;
            text-fill-color: transparent;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .view-btn {
            margin-top: 50px;
            padding: 20px 60px;
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            border: 2px solid white;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 3px;
            transition: 0.5s;
            backdrop-filter: blur(5px);
            border-radius: 0;
        }

        .view-btn:hover {
            background-color: white;
            color: black;
            transform: scale(1.05);
        }

        .container {
            max-width: 900px;
            margin: 0 auto 100px auto;
            padding: 60px;
            background: rgba(0, 0, 0, 0.95);
            border: 1px solid #111;
            text-align: center;
        }

        .section-title {
            font-size: 2.5em;
            margin-bottom: 30px;
            letter-spacing: 5px;
            text-transform: uppercase;
            border-bottom: 2px solid #fff;
            display: inline-block;
            padding-bottom: 10px;
        }

        .code-block {
            background-color: #050505;
            border: 1px solid #222;
            padding: 30px;
            border-radius: 4px;
            text-align: left;
            position: relative;
        }

        .code-block button {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: #fff;
            color: #000;
            border: none;
            padding: 10px 25px;
            font-weight: bold;
            cursor: pointer;
        }

        pre {
            color: #888;
            font-family: 'Consolas', monospace;
            overflow-x: auto;
            font-size: 1.1em;
        }

        footer {
            padding: 40px;
            text-align: center;
            color: #333;
            font-size: 0.8em;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div class="hero">
        <h1 class="title">Roxy Hub</h1>
        <button class="view-btn" onclick="document.getElementById('products').scrollIntoView()">Ürünleri Görüntüle</button>
    </div>

    <div class="container" id="products">
        <h2 class="section-title">Get Script</h2>
        <p style="color: #444; margin-bottom: 40px;">Siyah & Beyaz Minimalist Script Arayüzü</p>
        
        <div class="code-block">
            <button onclick="copyCode(this)">Kopyala</button>
            <pre id="myCode">
loadstring(game:HttpGet("https://raw.githubusercontent.com/benroxy/RoxyHub/main/script.lua"))()
            </pre>
        </div>
    </div>

    <footer>
        &copy; 2026 ROXY HUB / MONOCHROME
    </footer>

    <script>
        function copyCode(buttonElement) {
            const codeBlock = buttonElement.parentNode.querySelector('pre');
            const range = document.createRange();
            range.selectNode(codeBlock);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            try {
                document.execCommand('copy');
                buttonElement.textContent = 'Kopyalandı';
                setTimeout(() => {
                    buttonElement.textContent = 'Kopyala';
                }, 2000);
            } catch (err) {
                alert('Hata!');
            }
            window.getSelection().removeAllRanges();
        }
    </script>

</body>
</html>
